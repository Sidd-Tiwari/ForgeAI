spring:
  application.name: forgeai-gateway
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/forgeai}
    username: ${DATABASE_USERNAME:forgeai}
    password: ${DATABASE_PASSWORD:forgeai}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  data.redis.url: ${REDIS_URL:redis://localhost:6379}
  jackson.default-property-inclusion: non_null
server:
  shutdown: graceful
  error.include-message: never
  forward-headers-strategy: framework
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: forgeai-gateway
forgeai:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  demo-daily-quota: ${DEMO_DAILY_QUOTA:5}
  internal-token: ${FORGEAI_INTERNAL_TOKEN:}
  providers:
    openai-key: ${OPENAI_API_KEY:}
    anthropic-key: ${ANTHROPIC_API_KEY:}
    gemini-key: ${GEMINI_API_KEY:}
    openai-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/}
    anthropic-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/}
    gemini-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/}
  policy:
    max-retries: ${GATEWAY_MAX_RETRIES:2}
    retry-backoff: ${GATEWAY_RETRY_BACKOFF:200ms}
    cache-ttl: ${GATEWAY_CACHE_TTL:10m}
    requests-per-minute: ${GATEWAY_REQUESTS_PER_MINUTE:60}
    fallback-openai-model: ${GATEWAY_FALLBACK_OPENAI_MODEL:}
    fallback-anthropic-model: ${GATEWAY_FALLBACK_ANTHROPIC_MODEL:}
    fallback-gemini-model: ${GATEWAY_FALLBACK_GEMINI_MODEL:}
logging:
  level:
    org.springframework.web.reactive.function.client.ExchangeFunctions: WARN
    reactor.netty.http.client: WARN
resilience4j:
  circuitbreaker.instances.provider:
    sliding-window-size: 20
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    wait-duration-in-open-state: 30s
  retry.instances.provider:
    max-attempts: 2
    wait-duration: 250ms
