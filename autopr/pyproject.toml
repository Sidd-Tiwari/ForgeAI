[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "forge-autopr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "httpx>=0.28,<1", "pydantic-settings>=2.6,<3", "prometheus-client>=0.21,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=6,<8", "ruff>=0.8,<1"]
[tool.hatch.build.targets.wheel]
packages = ["forge_autopr"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
