[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"
[project]
name="forge-eval"
version="0.1.0"
requires-python=">=3.12"
dependencies=["pydantic>=2.10,<3", "typer>=0.15,<1", "rich>=13.9,<14"]
[project.optional-dependencies]
dev=["pytest>=8.3,<9", "ruff>=0.8,<1"]
[project.scripts]
forge-eval="forge_eval.cli:app"
[tool.hatch.build.targets.wheel]
packages=["forge_eval"]
[tool.ruff]
line-length=100
target-version="py312"
