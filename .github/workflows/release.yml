name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, autopr, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/forgeai-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with: {context: "./${{ matrix.service }}", push: true, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}", provenance: mode=max, sbom: true}
  deploy-production:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deployment adapter
        run: echo "Connect this protected job to the chosen cloud using OIDC; deploy immutable SHA tags, run smoke checks, and roll back on SLO failure."
