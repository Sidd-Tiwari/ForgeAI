server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://localhost:8080" always; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; location / { try_files $uri $uri/ /index.html; } }
