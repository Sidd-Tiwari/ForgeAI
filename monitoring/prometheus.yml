global: {scrape_interval: 15s, evaluation_interval: 15s}
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{targets: [gateway:8080]}]
  - job_name: autopr
    metrics_path: /metrics
    static_configs: [{targets: [autopr:8000]}]
rule_files: [alerts.yml]
